baseURL = "https://bin9chn.github.io/"
title = "Bin9chn"
theme = "nerdy"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableEmoji = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[pagination]
pagerSize = 10

[params]
description = "Bin9chn 的网络安全研究与工程项目笔记，关注协议安全、CTF、流量分析、漏洞研究和安全工具。"
keywords = "网络安全,协议安全,CTF,漏洞研究,HTTP/2,Bin9chn"

[markup]
[markup.highlight]
noClasses = false
style = "github-dark"
lineNos = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[build]
[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = "css"

[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.(js|mjs|ts)'
target = "css"

[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
disableWatch = true

[[menu.main]]
name = "文章"
weight = 1
url = "posts/"

[[menu.main]]
name = "项目"
weight = 2
url = "projects/"

[[menu.main]]
name = "友链"
weight = 3
url = "friends/"

[[menu.main]]
name = "关于"
weight = 4
url = "about/"
