baseURL = "https://bin9chn.github.io/"
title = "Bin9chn"
theme = "nerdy"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableEmoji = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[pagination]
pagerSize = 10

[params]
description = "Bin9chn 的个人博客：技术笔记、项目记录，还有一些没归类的日常。"
keywords = "Bin9chn,个人博客,技术笔记,项目,随笔"

# Page-view counters. GoatCounter is free for personal sites and needs no cookie;
# sign up at https://www.goatcounter.com/signup and put the subdomain here.
# Leave `goatcounter` empty to hide every counter (nothing is requested, nothing shows).
[params.views]
goatcounter = "bin9chn"

[markup]
[markup.highlight]
noClasses = false
style = "github-dark"
lineNos = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[build]
[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = "css"

[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.(js|mjs|ts)'
target = "css"

[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
disableWatch = true

[[menu.main]]
name = "文章"
weight = 1
url = "posts/"

[[menu.main]]
name = "项目"
weight = 2
url = "projects/"

[[menu.main]]
name = "友链"
weight = 3
url = "friends/"

[[menu.main]]
name = "关于"
weight = 4
url = "about/"
