baseURL = "https://bin9chn.github.io/"
title = "Bin9chn"
theme = "nerdy"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableEmoji = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Taxonomy kinds are off, but their default names still reserve content paths.
# Renaming them frees /categories/ for the hand-written category pages.
[taxonomies]
tag = "tags"
category = "cats"

[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[pagination]
pagerSize = 10

[params]
description = "Bin9chn 的个人博客：技术笔记、项目记录，还有一些没归类的日常。"
keywords = "Bin9chn,个人博客,技术笔记,项目,随笔"

# 站点主人姓名。荣誉页的论文作者列表会把它加粗，方便一眼看出自己在署名里的位置。
[params.author]
name = "Bingchen Lin"

# Home-page terminal demo. Templates and data/terminal/* are kept, so flipping
# this back to true restores the terminal without touching any code.
enableTerminal = false

# Page-view counters. GoatCounter is free for personal sites and needs no cookie;
# sign up at https://www.goatcounter.com/signup and put the subdomain here.
# Leave `goatcounter` empty to hide every counter (nothing is requested, nothing shows).
[params.views]
goatcounter = "bin9chn"

[markup]
[markup.highlight]
noClasses = false
style = "github-dark"
lineNos = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[build]
[build.buildStats]
enable = true

[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = "css"

[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.(js|mjs|ts)'
target = "css"

[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
disableWatch = true

[[menu.main]]
name = "文章"
weight = 1
url = "/posts/"

[[menu.main]]
name = "分类"
weight = 2
url = "/categories/"

[[menu.main]]
name = "归档"
weight = 3
url = "/archives/"

[[menu.main]]
name = "项目"
weight = 4
url = "/projects/"

[[menu.main]]
name = "荣誉"
weight = 5
url = "/honors/"

[[menu.main]]
name = "友链"
weight = 6
url = "/friends/"

[[menu.main]]
name = "关于"
weight = 7
url = "/about/"
