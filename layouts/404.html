{{ define "main" }}
  <div class="nerdy-page-surface">
    <div class="nerdy-ambient-bg"></div>
    <div class="nerdy-top-glow"></div>

    <div class="nerdy-container pb-20 pt-16">
      <div class="mx-auto max-w-2xl text-center">
        <p class="font-mono text-xs font-bold uppercase tracking-[0.3em] text-accent-cyan">Error 404</p>
        <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-4xl">这条路径不存在</h1>
        <p class="mx-auto mt-4 max-w-md text-sm leading-7 nerdy-muted">
          可能是链接过期了，也可能是我把文章挪了位置。下面几个入口应该能带你回去。
        </p>

        <form class="mt-8 flex items-center gap-2 rounded-xl border border-slate-300/80 bg-white/90 p-2 shadow-sm focus-within:border-accent-cyan dark:border-slate-700 dark:bg-slate-900/60" action="{{ "search/" | relURL }}" method="get" role="search">
          <label class="sr-only" for="notfound-search">搜索文章</label>
          <input
            class="w-full bg-transparent px-2 font-mono text-sm text-slate-900 outline-none placeholder:text-slate-400 dark:text-white dark:placeholder:text-slate-500"
            id="notfound-search"
            type="search"
            name="q"
            placeholder="输入关键词搜索文章"
            autocomplete="off">
          <button class="shrink-0 rounded-lg bg-accent-cyan/10 px-3 py-2 font-mono text-xs font-bold text-accent-cyan transition-colors hover:bg-accent-cyan/20" type="submit">搜索</button>
        </form>

        <div class="mt-8 flex flex-wrap justify-center gap-1.5">
          {{ range hugo.Data.categories }}
            <a class="nerdy-chip border-slate-300/80 text-slate-600 transition-colors hover:border-accent-cyan hover:text-accent-cyan dark:border-slate-700 dark:text-slate-400" href="{{ printf "categories/%s/" .slug | relURL }}">{{ .label }}</a>
          {{ end }}
        </div>

        <div class="mt-10 flex flex-wrap items-center justify-center gap-4 border-t border-slate-300/70 pt-6 font-mono text-xs dark:border-slate-700">
          <a class="nerdy-link inline-flex min-h-8 items-center" href="{{ "/" | relURL }}">← 回到首页</a>
          <a class="nerdy-link inline-flex min-h-8 items-center" href="{{ "posts/" | relURL }}">浏览全部文章</a>
          <a class="nerdy-link inline-flex min-h-8 items-center" href="{{ "archives/" | relURL }}">按年份归档</a>
        </div>
      </div>
    </div>
  </div>
{{ end }}
