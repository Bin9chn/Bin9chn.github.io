<header class="sticky top-0 z-50 border-b border-border/70 bg-background/80 backdrop-blur-xl" x-data="{ menuOpen: false }">
  <nav class="relative mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8" aria-label="主导航">
    <a class="group inline-flex items-center gap-2 text-lg font-bold" href="{{ site.Home.RelPermalink }}">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg border border-primary/30 bg-primary/10 font-mono text-sm text-primary transition group-hover:scale-105">~/</span>
      <span>{{ site.Title }}</span>
    </a>

    <div class="flex items-center gap-4">
      <div class="hidden items-center gap-5 md:flex">
        {{ range site.Menus.main }}
          <a class="text-sm font-medium text-muted-foreground transition-colors hover:text-foreground" href="{{ .URL | relLangURL }}">{{ .Name }}</a>
        {{ end }}
      </div>

      <div class="flex items-center gap-2 border-l border-border/70 pl-3 md:pl-4">
        {{ partial "components/theme-toggle.html" (dict "variant" "icon") }}
        <button class="nerdy-icon-button md:hidden" type="button" aria-label="打开导航" x-bind:aria-expanded="menuOpen.toString()" x-on:click="menuOpen = !menuOpen">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="absolute inset-x-4 top-[calc(100%+0.5rem)] z-50 rounded-xl border border-border bg-background/95 p-2 shadow-xl backdrop-blur-xl md:hidden" x-cloak x-show="menuOpen" x-on:click.outside="menuOpen = false">
      {{ range site.Menus.main }}
        <a class="block rounded-lg px-4 py-3 text-sm font-medium text-muted-foreground hover:bg-muted hover:text-foreground" href="{{ .URL | relLangURL }}" x-on:click="menuOpen = false">{{ .Name }}</a>
      {{ end }}
    </div>
  </nav>
</header>
