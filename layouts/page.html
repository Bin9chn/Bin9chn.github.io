{{ define "title" }}

{{ end }}

{{ define "content" }}
<article class="container project-page">
  <header class="page-head">
    <p class="eyebrow">ABOUT / PROFILE</p>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="article-content glass-panel">{{ .Content }}</div>
</article>
{{ end }}
