<section class="nerdy-sidebar-card">
  <h2 class="mb-2 font-mono text-[11px] font-bold uppercase tracking-widest nerdy-muted-soft sm:mb-3 sm:text-xs">{{ .title }}</h2>
  {{/* Phones: three values side by side in a single row. Tablets and up: the stacked list. */}}
  <div class="grid grid-cols-3 gap-2 font-mono text-[11px] sm:block sm:space-y-2 sm:text-xs">
    {{ range .items }}
      {{ $accentClasses := partial "components/accent-classes.html" (.accent | default "cyan") }}
      <div class="flex min-w-0 flex-col gap-0.5 sm:flex-row sm:items-center sm:justify-between sm:gap-4 sm:border-b sm:border-slate-200/80 sm:pb-1.5 sm:last:border-b-0 sm:last:pb-0 sm:dark:border-slate-700/50">
        <span class="truncate nerdy-muted">{{ .label }}:</span>
        <span class="truncate font-bold sm:text-right {{ $accentClasses.icon }}">{{ .value }}</span>
      </div>
    {{ end }}
  </div>
</section>
